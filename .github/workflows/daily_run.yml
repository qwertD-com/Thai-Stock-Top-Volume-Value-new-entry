name: Thai Stock Daily Automation

on:
  schedule:
    - cron: '0 11 * * 1-5' # 6:00 PM Bangkok Time, Mon-Fri
  workflow_dispatch:    # Allows manual trigger from GitHub UI
  repository_dispatch:  # Allows trigger from Google Sheets button
    types: [manual_reset_trigger]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Note: No 'wget' step here because the SET website blocks robots.
      # Ensure 'listedCompanies_en_US.xls' is uploaded to your repo root.

      - name: Install dependencies
        run: pip install yfinance pandas gspread google-auth lxml xlrd

      - name: Run Analysis
        env:
          GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
        run: python main.py
